<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CGI Demo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">

    <nav class="top">
      <a href="/">Dashboard</a>
      <a href="/manage.html">Uploads</a>
      <a href="/cgi.html">CGI</a>
      <a href="/errors.html">Errors</a>
      <a href="/uploads/">Autoindex</a>
    </nav>

    <h1>CGI Demo</h1>
    <p>Run CGI scripts and display output inside the page.</p>

    <div class="section">
      <h2>Run hello.py</h2>
      <p class="small">Expected: generated HTML with time, pid, request info.</p>
      <div class="row">
        <input type="text" id="name" value="Webserv" placeholder="name">
        <button onclick="runHello()">Run hello.py</button>
        <button onclick="runSleep()">Run sleep.py (3s)</button>
      </div>
      <iframe id="frame" src="about:blank"></iframe>
      <p class="small">Non-blocking test: while sleep runs, open other pages — server should still respond.</p>
    </div>

  </div>

<script>
function runHello() {
  const v = document.getElementById("name").value || "Anonymous";
  document.getElementById("frame").src = "/cgi-bin/hello.py?name=" + encodeURIComponent(v);
}
function runSleep() {
  document.getElementById("frame").src = "/cgi-bin/sleep.py";
}
</script>

</body>
</html>
